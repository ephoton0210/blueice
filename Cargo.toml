[workspace]
resolver = "2"
members = [
    "backend/ai-gatekeeper",
    "backend/automation",
    "backend/bluejs",
    "backend/ecma402",
    "backend/bluets",
    "backend/bluets-bluejs",
    "backend/core/dom",
    "backend/core/html",
    "backend/core/css",
    "backend/core/layout",
    "backend/core/font",
    "backend/core/paint",
    "backend/core/raster",
    "backend/core/engine",
    "backend/extension",
    "backend/frontend-reference",
    "backend/i18n",
    "backend/launcher",
    "backend/mcp-server",
    "backend/ipc",
    "backend/net",
    "backend/testing",
]

[workspace.package]
edition = "2021"
license = "MPL-2.0"
rust-version = "1.95"

# BlueJS's Test262 adapter exercises the bytecode interpreter through large,
# finite upstream harness matrices.  Leaving the interpreter itself at the
# default debug optimisation level makes ordinary conformance cases exceed
# their wall-clock budget by an order of magnitude.  Optimise the engine in
# development and test builds while retaining debug information and the usual
# unoptimised profile for the rest of the workspace.
[profile.dev.package.blueice-bluejs]
opt-level = 3

[profile.test.package.blueice-bluejs]
opt-level = 3

# The rest of the engine's runtime path needs the same treatment. Left at the
# default level, dependencies dominated the run time of the heaviest Test262
# cases (measured on one machine, before -> after):
#   * `regress` (RegExp matching, in the `bluejs-regexp-worker` helper process)
#     and `serde_json` (every request and reply crosses a pipe) made
#     `Function/prototype/toString/built-in-function-object.js` 73.6 s -> 19.3 s;
#     `regress` also ran its debug assertions while compiling the large Unicode
#     classes of the `nativeFunctionMatcher.js` harness, so they are turned off.
#   * ICU4X and the other dependencies behind `blueice-ecma402` made
#     `intl402/fallback-locales-are-supported.js` 16.7 s -> 4.5 s.
# `"*"` covers every dependency but no workspace member, so the rest of the
# workspace keeps its fast unoptimised debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3

[profile.dev.package.regress]
opt-level = 3
debug-assertions = false

[profile.test.package.regress]
opt-level = 3
debug-assertions = false

[profile.dev.package.blueice-ecma402]
opt-level = 3

[profile.test.package.blueice-ecma402]
opt-level = 3

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      # `backend/core/html/tests/wpt_corpus.rs`'s WPT tree-construction
      # gate (see `testing/TEST_PLAN.md`) needs this checked out or it
      # just skips itself -- a sparse partial clone of the one
      # subdirectory that matters, not the whole web-platform-tests
      # monorepo, per `reference/README.md`'s own fetch commands.
      - name: Fetch WPT tree-construction corpus
        run: |
          git clone --filter=blob:none --sparse --depth 1 https://github.com/web-platform-tests/wpt.git development/browser_core/reference/wpt
          git -C development/browser_core/reference/wpt sparse-checkout set html/syntax/parsing
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Phase 6 human-evidence verifier
        run: python3 -m unittest discover -s development/browser_core/phase-6-ai-agent-integration-demo -p test_verify_human_evidence.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The in-process `candle` backend is behind a cargo feature that no
      # default build enables, so it is built, linted, and tested explicitly.
      - name: candle backend (feature build)
        run: |
          cargo clippy -p blueice-ai-assistant --features candle --all-targets -- -D warnings
          cargo test -p blueice-ai-assistant --features candle

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # See development/browser_core/testing/TEST_PLAN.md for the policy
      # this enforces. Two files are excluded, both for the same reason:
      # a real (non-stub) process entry point whose own logic is already
      # unit-tested elsewhere, leaving only GUI/OS wiring that can't run
      # headlessly in CI. `extension/src/main.rs` is the placeholder
      # process; `blueice-frontend`'s `main.rs` is the real winit/
      # softbuffer reference frontend -- its pure helpers (pixel format
      # conversion, socket-path/binary-path resolution) are unit tested
      # in that same file, but the windowed event loop itself needs a
      # real display and was verified manually instead (see Phase 4's
      # PLAN.md). `blueice-core`'s own binary (`engine/src/bin/blueice-
      # core.rs`) is NOT excluded, on purpose: unlike a window, a Unix
      # socket server has no display dependency, so
      # `engine/tests/core_binary.rs` drives the actual compiled binary
      # as a subprocess and gets real coverage of it in CI.
      - name: Generate coverage and enforce threshold
        run: |
          set -o pipefail
          cargo llvm-cov --workspace \
            --ignore-filename-regex 'extension/src/main\.rs$|frontend-reference/src/main\.rs$|ai-assistant/src/bin/blueice-ai-assistant\.rs$' \
            --fail-under-lines 90 \
            --summary-only \
            | tee coverage-summary.txt
      - name: Publish summary
        if: always()
        run: |
          {
            echo '### Coverage summary'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  chromium-differential:
    name: Chromium differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: differential-testing/package-lock.json
      - uses: Swatinem/rust-cache@v2
      # Install Chrome for Testing explicitly rather than relying on a package
      # postinstall hook. This keeps the browser revision visible in CI and
      # works with npm configurations that disallow lifecycle scripts.
      - name: Install differential-test dependencies
        working-directory: differential-testing
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci
      - name: Install Chrome for Testing
        run: npm exec --prefix differential-testing puppeteer browsers install chrome
      - name: Build BlueIce subprocesses
        run: cargo build --workspace --all-targets
      - name: Check harness helpers
        working-directory: differential-testing
        run: npm test
      # compare.js and trend.js intentionally have no similarity threshold:
      # known MVP rendering gaps are evidence to review, not test failures.
      - name: Capture and compare against Chromium
        working-directory: differential-testing
        run: npm run differential
      - name: Publish differential trend
        if: always()
        run: |
          {
            echo '### Chromium differential trend'
            if [ -f differential-testing/output/trend.md ]; then
              cat differential-testing/output/trend.md
            else
              echo 'No trend report was produced; inspect the failed harness step above.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload differential artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-differential
          path: differential-testing/output
          if-no-files-found: ignore

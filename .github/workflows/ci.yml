name: Core root-continuation diagnostic

on:
  workflow_dispatch:

jobs:
  navigation:
    name: Diagnose core root continuation on macOS 26 x86_64
    runs-on: macos-26-intel
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Build launcher prerequisites
        run: cargo build -p blueice-launcher --bins
      - name: Repeat the real-core root continuation regression
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 25); do
            echo "Root continuation diagnostic attempt $attempt"
            cargo test -p blueice-engine --test core_binary root_control::real_subprocess_pauses_and_resumes_a_non_entry_root_safe_point_without_debugger_leaks -- --exact --nocapture
          done
      - name: Run every core subprocess test together
        run: cargo test -p blueice-engine --test core_binary -- --nocapture

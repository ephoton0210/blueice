name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build, test, lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Compile-time fixtures in BlueJS integration tests must come from the
      # same immutable Test262 revision on every operating system.
      - name: Checkout pinned Test262 corpus
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: 72faf8ec1445c55149615e8b35187830783aba1a
          path: development/browser_core/reference/test262
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Use the same independent ICU implementation on every OS for the
      # provider-backed NumberFormat differential matrix below.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      # `backend/core/html/tests/wpt_corpus.rs`'s WPT tree-construction
      # gate (see `testing/TEST_PLAN.md`) needs this checked out or it
      # just skips itself -- a sparse partial clone of the one
      # subdirectory that matters, not the whole web-platform-tests
      # monorepo, per `reference/README.md`'s own fetch commands.
      - name: Fetch WPT tree-construction corpus
        run: |
          git clone --filter=blob:none --sparse --depth 1 https://github.com/web-platform-tests/wpt.git development/browser_core/reference/wpt
          git -C development/browser_core/reference/wpt sparse-checkout set html/syntax/parsing
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: NumberFormat Node differential matrix
        run: >-
          cargo test -p blueice-bluejs --test node_differential
          number_format_matrix_matches_node -- --ignored
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rustfmt
        run: cargo fmt --all -- --check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `cargo llvm-cov --workspace` compiles BlueJS integration tests whose
      # fixtures are embedded with `include_str!`; use the same immutable
      # corpus as the cross-platform build-and-test job.
      - name: Checkout pinned Test262 corpus
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: 72faf8ec1445c55149615e8b35187830783aba1a
          path: development/browser_core/reference/test262
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # See development/browser_core/testing/TEST_PLAN.md for the policy
      # this enforces. Two files are excluded, both for the same reason:
      # a real (non-stub) process entry point whose own logic is already
      # unit-tested elsewhere, leaving only GUI/OS wiring that can't run
      # headlessly in CI. `extension/src/main.rs` is the placeholder
      # process; `blueice-frontend`'s `main.rs` is the real winit/
      # softbuffer reference frontend -- its pure helpers (pixel format
      # conversion, socket-path/binary-path resolution) are unit tested
      # in that same file, but the windowed event loop itself needs a
      # real display and was verified manually instead (see Phase 4's
      # PLAN.md). `blueice-core`'s own binary (`engine/src/bin/blueice-
      # core.rs`) is NOT excluded, on purpose: unlike a window, a Unix
      # socket server has no display dependency, so
      # `engine/tests/core_binary.rs` drives the actual compiled binary
      # as a subprocess and gets real coverage of it in CI.
      - name: Generate coverage and enforce threshold
        run: |
          set -o pipefail
          cargo llvm-cov --workspace \
            --ignore-filename-regex 'extension/src/main\.rs$|frontend-reference/src/main\.rs$' \
            --fail-under-lines 90 \
            --summary-only \
            | tee coverage-summary.txt
      - name: Enforce BlueJS 88 percent line coverage
        run: |
          # Measure BlueJS independently of workspace instrumentation.
          cargo llvm-cov clean --workspace
          cargo llvm-cov -p blueice-bluejs --fail-under-lines 88 --summary-only
      - name: Publish summary
        if: always()
        run: |
          {
            echo '### Coverage summary'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  typescript-oracle:
    name: BlueTS TypeScript oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - name: Run the pinned TypeScript 5.9.3 fixture matrix
        run: >-
          npm exec --yes --package typescript@5.9.3 --
          env BLUEICE_TSC=tsc
          cargo test -p blueice-bluets --test typescript_oracle -- --ignored

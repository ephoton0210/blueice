name: Core navigation stage diagnostic

on:
  workflow_dispatch:

jobs:
  navigation:
    name: Diagnose core navigation stages on macOS 26 x86_64
    runs-on: macos-26-intel
    env:
      BLUEICE_NAV_DIAGNOSTICS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Build launcher prerequisites
        run: cargo build -p blueice-launcher --bins
      - name: Repeat every real-core subprocess test with stage diagnostics
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 25); do
            echo "Core stage diagnostic attempt $attempt"
            cargo test -p blueice-engine --test core_binary -- --nocapture
          done

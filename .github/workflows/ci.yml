name: Core navigation diagnostic

on:
  workflow_dispatch:

jobs:
  navigation:
    name: Diagnose core navigation on macOS 26 x86_64
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Build launcher prerequisites
        run: cargo build -p blueice-launcher --bins
      - name: Repeat the real-core navigation isolation regression
        shell: bash
        run: |
          for attempt in $(seq 1 25); do
            echo "Navigation diagnostic attempt $attempt"
            cargo test -p blueice-engine --test core_binary core_session::real_script_socket_denials_preserve_each_live_dom_across_tabs_navigation_and_core_replacement -- --exact --nocapture
          done
      - name: Run every core subprocess test together
        run: cargo test -p blueice-engine --test core_binary -- --nocapture

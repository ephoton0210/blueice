name: CI macOS 15 cold font navigation diagnostic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build, test, lint (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    env:
      BLUEICE_NAV_DIAGNOSTICS: "1"
    # Empty for a native runner; otherwise the job's steps run inside this
    # image on the (Ubuntu) runner host.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        # Diagnostic branch only: isolate the original-profile core binary tests.
        include:
          - { label: "macOS 15 x86_64", os: macos-15-intel }
    steps:
      # The distro images are minimal: install what `actions/checkout`, the
      # Rust toolchain (linker, `ring`'s C build), `setup-node`, the CLDR
      # `cmp` check, the WPT `git clone` and `rust-cache` need. Must run
      # before checkout so `git` exists for it.
      - name: Install RHEL prerequisites
        if: matrix.family == 'rhel'
        run: |
          dnf install -y git gcc gcc-c++ make tar gzip xz zstd diffutils tzdata findutils
          command -v curl >/dev/null || dnf install -y curl
      - name: Install SUSE prerequisites
        if: matrix.family == 'suse'
        run: |
          # These build dependencies do not use the optional codec repository.
          # Its availability must not prevent installing the required packages.
          if [ -f /etc/zypp/repos.d/repo-openh264.repo ]; then
            zypper --non-interactive modifyrepo --disable repo-openh264
          fi
          zypper --non-interactive install --no-recommends git-core gcc gcc-c++ make tar gzip xz zstd diffutils timezone findutils curl
          # These images declare no PATH of their own, so the first entry a
          # later step adds to GITHUB_PATH (rustup's) would become the whole
          # PATH and `bash` would no longer resolve. Pin the default one.
          for dir in /usr/local/sbin /usr/local/bin /usr/sbin /usr/bin /sbin /bin; do
            echo "$dir" >> "$GITHUB_PATH"
          done
      - uses: actions/checkout@v4
      # Compile-time fixtures in BlueJS integration tests must come from the
      # same immutable Test262 revision on every operating system.
      - name: Checkout pinned Test262 corpus
        uses: actions/checkout@v4
        env:
          # Test262 asserts the original LF, CR and CRLF source sequences.
          # Override Windows Git defaults only for this corpus checkout.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          repository: tc39/test262
          ref: 72faf8ec1445c55149615e8b35187830783aba1a
          path: development/browser_core/reference/test262
      - name: Verify Test262 line-terminator fixture bytes
        shell: bash
        run: |
          corpus=development/browser_core/reference/test262
          for ending in LF CR CR-LF; do
            fixture="test/built-ins/Function/prototype/toString/line-terminator-normalisation-${ending}.js"
            expected=$(git -C "$corpus" rev-parse "HEAD:$fixture")
            actual=$(git -C "$corpus" hash-object --no-filters "$fixture")
            if [ "$actual" != "$expected" ]; then
              echo "::error::Test262 checkout changed source bytes: $fixture"
              exit 1
            fi
          done
      # The checked-in .b64 provider is a source input, not a build cache.
      # Rebuild it from its exact CLDR source on every CI platform so a
      # provider update cannot be generated on one OS and silently diverge on
      # another.
      - name: Checkout pinned CLDR JSON provider source
        uses: actions/checkout@v4
        with:
          repository: unicode-org/cldr-json
          ref: 26a79cb42bfcc90def764102aa2af126d9ef3108
          path: development/browser_core/reference/cldr-json
          # The packages live under the repository's own `cldr-json/`
          # directory, which is also the root the generators are given.
          sparse-checkout: |
            cldr-json/cldr-bcp47/bcp47
            cldr-json/cldr-core
            cldr-json/cldr-localenames-full/main
            cldr-json/cldr-dates-full/main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Use the same independent ICU implementation on every OS for the
      # provider-backed NumberFormat differential matrix below.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Compare decompressed payloads, not files: the gzip bytes depend on the
      # zlib build bundled with a given Node release, while the table inside
      # is what the pinned CLDR revision actually determines.
      - name: Verify pinned CLDR provider is reproducible
        shell: bash
        run: |
          cldr=development/browser_core/reference/cldr-json
          tools=backend/ecma402/tools
          data=backend/ecma402/src/locale_data
          node $tools/generate_cldr_display_names.mjs \
            $cldr/cldr-json $cldr/display_names_data.verify.b64
          node $tools/compare_cldr_payloads.mjs \
            $data/display_names_data.b64 $cldr/display_names_data.verify.b64
          node $tools/generate_cldr_date_time_formats.mjs \
            $cldr/cldr-json \
            $cldr/date_time_formats_data.verify.b64 \
            $cldr/date_time_append_items_data.verify.b64
          node $tools/compare_cldr_payloads.mjs \
            $data/date_time_formats_data.b64 $cldr/date_time_formats_data.verify.b64
          node $tools/compare_cldr_payloads.mjs \
            $data/date_time_append_items_data.b64 $cldr/date_time_append_items_data.verify.b64
          node $tools/generate_cldr_locale_information.mjs \
            $cldr/cldr-json $cldr/locale_information_data.verify.b64
          node $tools/compare_cldr_payloads.mjs \
            $data/locale_information_data.b64 $cldr/locale_information_data.verify.b64
      # Keyed per matrix leg: the distro legs share one runner OS/arch, and
      # a `target/` (build scripts, C objects) built against one distro's
      # glibc must never be restored into another's.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}
      # `backend/core/html/tests/wpt_corpus.rs`'s WPT tree-construction
      # gate (see `testing/TEST_PLAN.md`) needs this checked out or it
      # just skips itself -- a sparse partial clone of the one
      # subdirectory that matters, not the whole web-platform-tests
      # monorepo, per `reference/README.md`'s own fetch commands.
      - name: Fetch WPT tree-construction corpus
        run: |
          git clone --filter=blob:none --sparse --depth 1 https://github.com/web-platform-tests/wpt.git development/browser_core/reference/wpt
          git -C development/browser_core/reference/wpt sparse-checkout set html/syntax/parsing
      - name: Test cold core subprocess font initialization
        run: cargo test -p blueice-engine --test core_binary -- --nocapture
      - name: Rustfmt
        if: runner.os != 'Windows'
        run: cargo fmt --all -- --check
      - name: Rustfmt (Windows packages)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # A single workspace rustfmt invocation exceeds Windows' command-line
          # limit. Discover every workspace member and check all its targets.
          $metadata = cargo metadata --no-deps --offline --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "cargo metadata failed" }
          $members = @($metadata.packages | Where-Object { $_.id -in $metadata.workspace_members })
          foreach ($package in $members) {
            cargo fmt --package $package.name -- --check
            if ($LASTEXITCODE -ne 0) { throw "Rustfmt failed for $($package.name)" }
          }

[package]
name = "blueice-avif"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "AVIF still-image decoding (avif-parse container, rav1d AV1) behind a safe interface"

[dependencies]
avif-parse = "2.1.0"
libc = "0.2"
# The AV1 decoder, in Rust, without its assembly: no C or assembler build step.
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

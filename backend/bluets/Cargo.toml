[package]
name = "blueice-bluets"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "bluetsc"
path = "src/bin/bluetsc.rs"

[[bin]]
name = "bluets-test-interface"
path = "src/bin/bluets-test-interface.rs"

[dependencies]
base64 = "0.23.1"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3"

[dev-dependencies]
proc-macro2 = "=1.0.107"
syn = { version = "=2.0.119", features = ["full", "visit"] }

[package]
name = "blueice-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
blueice-ipc = { path = "../ipc" }
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
suppaftp = { version = "12", features = ["native-tls"] }
ureq = "3"
url = "2"
zeroize = "1"

[package]
name = "blueice-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
blueice-ipc = { path = "../ipc" }
httpdate = "1"
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"] }
libc = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
suppaftp = { version = "12", features = ["native-tls"] }
# A ranged downloader must observe encoded bytes and headers verbatim.  In
# particular, ureq's default `gzip` feature transparently decodes any
# Content-Encoding response even when the request says `Accept-Encoding:
# identity`, making Content-Range offsets unsafe.
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
zeroize = "1"

[dev-dependencies]
openssl = "0.10"

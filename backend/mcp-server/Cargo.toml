[package]
name = "blueice-mcp-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
autobins = false

[[bin]]
name = "blueice-mcp-server"
path = "src/main.rs"

# Keep the established CLI name while naming its source by responsibility.
[[bin]]
name = "blueice-phase6-agent"
path = "src/bin/blueice-scenario-agent.rs"

[dependencies]
base64 = "0.23.1"
blueice-ecma402 = { version = "0.1.0", path = "../ecma402" }
blueice-ipc = { version = "0.1.0", path = "../ipc" }
blueice-launcher = { version = "0.1.0", path = "../launcher" }
blueice-assistant-settings = { path = "../assistant-settings" }
blueice-raster = { version = "0.1.0", path = "../core/raster" }
rmcp = { version = "3.2.0", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2.5.8"

[dev-dependencies]
# Exercise the compiled stdio server through the official Rust MCP client,
# rather than a second hand-written JSON-RPC implementation.
rmcp = { version = "3.2.0", features = ["client", "transport-child-process"] }
tokio = { version = "1.53.1", features = ["process"] }
blueice-bluets = { path = "../bluets" }
blueice-engine = { path = "../core/engine" }

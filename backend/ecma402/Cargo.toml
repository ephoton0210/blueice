[package]
name = "blueice-ecma402"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
fixed_decimal = { version = "=0.7.2", features = ["ryu"] }
icu_collator = "=2.2.0"
icu_decimal = { version = "=2.2.0", features = ["ryu", "unstable"] }
icu_datetime = "=2.2.0"
icu_list = "=2.2.0"
icu_locale = "=2.2.0"
icu_locale_core = "=2.3.0"
icu_plurals = "=2.2.0"
icu_provider = "=2.3.1"
icu_segmenter = "=2.2.0"
jiff = { version = "=0.2.35", default-features = false, features = ["std", "tzdb-bundle-always"] }
jiff-tzdb = "=0.1.8"
writeable = "=0.6.4"

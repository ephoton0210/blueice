[package]
name = "blueice-bluejs"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
blueice-ecma402 = { path = "../ecma402" }
regress = { version = "=0.12.0", features = ["utf16"] }
unicode-normalization = "=0.1.25"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
icu_casemap = { git = "https://github.com/ephoton0210/icu4x.git", rev = "31dcf42731d45cb191cdbd5bb92b669b5be12b57" }
icu_calendar = { git = "https://github.com/ephoton0210/icu4x.git", rev = "31dcf42731d45cb191cdbd5bb92b669b5be12b57" }
icu_locale = { git = "https://github.com/ephoton0210/icu4x.git", rev = "31dcf42731d45cb191cdbd5bb92b669b5be12b57" }
icu_locale_core = { git = "https://github.com/ephoton0210/icu4x.git", rev = "31dcf42731d45cb191cdbd5bb92b669b5be12b57" }
icu_properties = { git = "https://github.com/ephoton0210/icu4x.git", rev = "31dcf42731d45cb191cdbd5bb92b669b5be12b57" }
# Temporal's IANA time-zone transition history (Phase 26 Stage 1 Track E).
# `icu_time` deliberately carries only display-name-era data, so the pinned,
# bundled IANA Time Zone Database `blueice-ecma402` already formats with is
# the one real transition source in this workspace; `vm/temporal/time_zone.rs`
# reads it directly, the same way `vm/temporal/calendar.rs` reads
# `icu_calendar` directly rather than through the ECMA-402 crate.
jiff = { version = "=0.2.35", default-features = false, features = ["std", "tzdb-bundle-always"] }
jiff-tzdb = "=0.1.8"
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
# Byte-budget native-stack-depth guard for `Vm::enter_call` (see
# `vm/completion.rs`'s `CALL_STACK_RED_ZONE` doc comment): every JS call
# recurses through Rust's own call stack, so this measures the native stack
# actually left on the running thread (`stacker::remaining_stack`) rather than
# counting frames. Only that read-only query is used, never `maybe_grow`.
stacker = "=0.1.25"

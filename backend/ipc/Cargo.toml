[package]
name = "blueice-ipc"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# Native pointer snapshots are echoed and compared exactly across the IPC boundary.
serde_json = { version = "1", features = ["float_roundtrip"] }
memmap2 = "0.9"
libc = "0.2"

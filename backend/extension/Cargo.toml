[package]
name = "blueice-extension-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
blueice-ipc = { path = "../ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasmtime = { version = "49.0.0", default-features = false, features = ["cranelift", "runtime"] }

[dev-dependencies]
wat = "1"
